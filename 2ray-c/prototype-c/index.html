<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2Ray-C — Prototype C (plain JS)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 8px; left: 8px; z-index: 1;
    display: flex; gap: 14px;
    font: 12px/1.35 monospace; color: #fff;
  }
  #controls label { display: flex; flex-direction: column; gap: 2px; }
  #controls input {
    width: 72px; box-sizing: border-box;
    background: #000; color: #fff;
    border: 1px solid #fff; border-radius: 0;
    padding: 3px 5px; font: inherit;
  }
  #fps {
    position: fixed; top: 8px; right: 8px; z-index: 1;
    font: 12px/1.35 monospace; color: #fff;
  }
  #bench {
    position: fixed; bottom: 8px; right: 8px; z-index: 1;
    font: 12px/1.35 monospace; color: #fff;
  }
  #formula {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 2; opacity: 0.5; text-align: center;
    font-family: "STIX Two Math", "Latin Modern Math", "Cambria Math", Georgia, serif;
    font-style: italic;
    font-size: clamp(0.5rem, 1.2vw, 1rem);
    line-height: 1.3;
    color: #fff; white-space: pre-line;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <label>view angle &deg;
    <input id="angleInput" type="number" step="0.1" value="60" />
  </label>
  <label>rays per &deg;
    <input id="densityInput" type="number" step="0.1" value="2" />
  </label>
  <label>focal
    <input id="focalInput" type="number" step="0.1" value="1.5" />
  </label>
  <label>pow
    <input id="powInput" type="number" step="0.1" value="1" />
  </label>
  <label>fish
    <input id="fishInput" type="number" step="0.1" value="1" />
  </label>
  <label>maxh
    <input id="maxhInput" type="number" step="0.1" value="1" />
  </label>
</div>
<div id="fps">FPS: --</div>
<div id="bench">BENCH: press B</div>
<div id="formula"></div>
<script src="main.js"></script>
</body>
</html>
