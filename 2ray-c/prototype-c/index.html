<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2Ray-C — Prototype C (plain JS)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #controls {
    position: fixed; top: 8px; left: 8px; z-index: 1;
    display: flex; gap: 14px;
    font: 12px/1.35 monospace; color: #fff;
  }
  #controls label { display: flex; flex-direction: column; gap: 2px; }
  #controls input {
    width: 72px; box-sizing: border-box;
    background: #000; color: #fff;
    border: 1px solid #fff; border-radius: 0;
    padding: 3px 5px; font: inherit;
  }
  #fps {
    position: fixed; top: 8px; right: 8px; z-index: 1;
    font: 12px/1.35 monospace; color: #fff;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">
  <label>view angle &deg;
    <input id="angleInput" type="number" value="60" />
  </label>
  <label>rays per &deg;
    <input id="densityInput" type="number" value="2" />
  </label>
</div>
<div id="fps">FPS: --</div>
<script src="main.js"></script>
</body>
</html>
